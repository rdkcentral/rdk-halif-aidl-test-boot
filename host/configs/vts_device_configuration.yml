# The information defined in this config is consistent across all devices of a type.

deviceConfig:
    cpe1:
        platform:   "vDevice"
        model:      "VTV"
        soc_vendor: "appleM3"
        target_directory: "/tmp/"
        boot_process_name: "Vendor-Boot"
        prompt: "~#" # Prompt string on console
        wait_time: 240 #Configurable timeout value to limit the total duration of individual tests
        test:
            profile: "../../profiles/hfp-boot-vcomponent.yaml" #HFP profile used to meet platform requirements
            #platform_led_config: "../../test_configuration/vts_indicator_LED_config_vdevice.yaml"
