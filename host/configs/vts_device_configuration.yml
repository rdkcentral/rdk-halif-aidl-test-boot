# The information defined in this config is consistent across all devices of a type.

deviceConfig:
    cpe1:
        platform:   "vDevice"
        model:      "VTV"
        soc_vendor: "appleM3"
        target_directory: "/tmp/"
        boot_volatile_directory: "/tmp/"
        boot_non_volatile_directory: "/home/root/"
        prompt: "~#" # Prompt string on console
        wait_time: 40 #Configurable timeout value to limit the total duration of individual tests
        test:
            profile: "../../profiles/hfp-boot.yaml" #HFP profile used to meet platform requirements
