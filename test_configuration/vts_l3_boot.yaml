Boot:
  L3:
    BootReason: # The list of valid boot reasons from BootReason.h for testing
      - WATCHDOG
      - MAINTENANCE_REBOOT
      - THERMAL_RESET
      - WARM_RESET
      - COLD_BOOT
      - STR_AUTH_FAILURE
      - ERROR_UNKNOWN
    ResetTypes: # The list of valid reset types from ResetType.h for testing
      - FULL_SYSTEM_RESET
      - INVALIDATE_CURRENT_APPLICATION_IMAGE
      - FORCE_DISASTER_RECOVERY
      - MAINTENANCE_REBOOT
      - SOFTWARE_REBOOT
    # Matrix 2A: Override with SOFTWARE_REBOOT (Should Work - Override Preserved)
    # Using dictionary structure for better ConfigRead compatibility
    # To disable a test, comment out the entire test block (test ID and all its properties)
    # Optional field: bootReasonIndexOverride - Use this to specify a custom index (e.g., -1 for ERROR_UNKNOWN)
    # Example to disable OVR-SW-01:
    #   # OVR-SW-01:
    #   #   testId: "OVR-SW-01"
    #   #   bootReason: "WATCHDOG"
    #   #   ...
    OverrideBootReasonMatrix2A:
      OVR-SW-01:
        testId: "OVR-SW-01"
        bootReason: "WATCHDOG"
        reasonString: "Watchdog override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "WATCHDOG"
      OVR-SW-02:
        testId: "OVR-SW-02"
        bootReason: "THERMAL_RESET"
        reasonString: "Thermal override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "THERMAL_RESET"
      OVR-SW-03:
        testId: "OVR-SW-03"
        bootReason: "STR_AUTH_FAILURE"
        reasonString: "Auth failure override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "STR_AUTH_FAILURE"
      OVR-SW-04:
        testId: "OVR-SW-04"
        bootReason: "COLD_BOOT"
        reasonString: "Cold boot override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "COLD_BOOT"
      OVR-SW-05:
        testId: "OVR-SW-05"
        bootReason: "MAINTENANCE_REBOOT"
        reasonString: "Maintenance override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "MAINTENANCE_REBOOT"
      OVR-SW-06:
        testId: "OVR-SW-06"
        bootReason: "WARM_RESET"
        reasonString: "Warm reset override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "WARM_RESET"
      OVR-SW-07:
        testId: "OVR-SW-07"
        bootReason: "ERROR_UNKNOWN"
        bootReasonIndexOverride: -1  # Use -1 instead of default index (6)
        reasonString: "Unknown override"
        resetType: "SOFTWARE_REBOOT"
        expectedBootReason: "ERROR_UNKNOWN"
    # Matrix 2B: Override with Other Reset Types (Should NOT Work - Override Ignored)
    # Using dictionary structure for better ConfigRead compatibility
    # To disable a test, comment out the entire test block
    OverrideBootReasonMatrix2B:
      OVR-IG-01:
        testId: "OVR-IG-01"
        bootReason: "WATCHDOG"
        reasonString: "Watchdog override attempt"
        resetType: "FULL_SYSTEM_RESET"
        expectedBootReason: "WARM_RESET"
      OVR-IG-02:
        testId: "OVR-IG-02"
        bootReason: "THERMAL_RESET"
        reasonString: "Thermal override attempt"
        resetType: "INVALIDATE_CURRENT_APPLICATION_IMAGE"
        expectedBootReason: "WARM_RESET"
      OVR-IG-03:
        testId: "OVR-IG-03"
        bootReason: "STR_AUTH_FAILURE"
        reasonString: "Auth failure override attempt"
        resetType: "FORCE_DISASTER_RECOVERY"
        expectedBootReason: "WARM_RESET"
      OVR-IG-04:
        testId: "OVR-IG-04"
        bootReason: "COLD_BOOT"
        reasonString: "Cold boot override attempt"
        resetType: "MAINTENANCE_REBOOT"
        expectedBootReason: "MAINTENANCE_REBOOT"
      OVR-IG-05:
        testId: "OVR-IG-05"
        bootReason: "WATCHDOG"
        reasonString: "Watchdog override attempt 2"
        resetType: "MAINTENANCE_REBOOT"
        expectedBootReason: "MAINTENANCE_REBOOT"

